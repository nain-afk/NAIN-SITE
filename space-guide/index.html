<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="욕실부터 도서관, 어린이집, 사무실까지 공간별로 살펴보는 나인의 실내 공기 솔루션.">
<title>공간별 솔루션 | 주식회사 나인</title>
<style>
:root{color-scheme:light;--ink:#28352e;--green:#294938;--paper:#f7f4eb;--line:#d8d9cf}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 "Malgun Gothic",system-ui,sans-serif;word-break:keep-all}
a{color:inherit}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #ab6334;outline-offset:4px}
header,main,footer{width:min(1180px,calc(100% - 48px));margin:auto}header{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}header img{display:block;width:112px;height:auto}nav{display:flex;gap:22px;flex-wrap:wrap}nav a{text-underline-offset:5px}
.hero{display:grid;grid-template-columns:42% 58%;min-height:490px;background:var(--green);color:#fff9ed;border-radius:4px;overflow:hidden}
.hero-copy{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:clamp(25px,5vw,66px)}
.label{font-weight:700;color:#f1d6a9;margin:0 0 12px}.hero h1{font-size:clamp(34px,4.3vw,62px);line-height:1.2;letter-spacing:-.065em;margin:0 0 18px}.hero p:not(.label){margin:0 0 24px}.hero a{background:#fff9ed;color:var(--green);text-decoration:none;padding:10px 18px;font-weight:700}
.hero img{width:100%;height:100%;min-height:0;aspect-ratio:4/3;display:block;object-fit:cover}
.spaces{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.spaces button{padding:12px;color:var(--ink);background:#fffdf7;border:1px solid var(--line);font-weight:700}.spaces button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}
section+section{margin-top:70px}h2{font-size:clamp(26px,3vw,38px);letter-spacing:-.05em;margin:0 0 17px;line-height:1.2}
.products{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.products article{background:#fffdf7;border:1px solid var(--line)}article img{width:100%;height:190px;object-fit:contain;display:block;background:#eeeee6}article div{padding:18px}h3,p{margin:0}h3{margin-bottom:6px}article p{color:#4a594f}
.contact{padding:clamp(24px,5vw,50px);background:#e4eae0;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.contact h2{margin-bottom:8px}.phone{padding:11px 18px;background:var(--green);color:white;font-weight:700;text-decoration:none}
footer{border-top:1px solid var(--line);margin-top:46px;padding:20px 0;font-size:14px}
@media(max-width:730px){header,main,footer{width:calc(100% - 32px)}header{min-height:66px}nav{gap:12px;font-size:14px}.hero{grid-template-columns:1fr;min-height:0}.hero img{height:auto;aspect-ratio:16/10}.spaces{grid-template-columns:repeat(2,1fr)}section+section{margin-top:45px}.products{grid-template-columns:1fr}article img{height:165px}}
</style>
</head>
<body>
<header><a href="../"><img src="../assets/logo.png" alt="주식회사 나인 홈"></a><nav aria-label="주 메뉴"><a href="../products/">제품 소개</a><a href="#contact">설치 문의</a></nav></header>
<main>
<section aria-label="공간별 솔루션">
<div class="hero" id="space">
<div class="hero-copy" aria-live="polite">
<p class="label" id="space-name">욕실</p>
<h1 id="space-title">하루의 처음과 끝이<br>편안한 욕실</h1>
<p id="space-description">욕실 공간에 맞는 제품과 설치 방법을 살펴보세요.</p>
<a href="#products">제품 살펴보기</a>
</div>
<img id="space-photo" src="../assets/bathroom.jpg" alt="욕실 천장형 제품 설치 연출 이미지">
</div>
<div class="spaces" role="group" aria-label="공간 선택">
<button type="button" aria-pressed="true" aria-controls="space" data-space="bathroom">욕실</button>
<button type="button" aria-pressed="false" aria-controls="space" data-space="library">도서관</button>
<button type="button" aria-pressed="false" aria-controls="space" data-space="daycare">어린이집</button>
<button type="button" aria-pressed="false" aria-controls="space" data-space="office">사무실</button>
</div>
</section>
<section id="products">
<h2>나인의 제품</h2>
<div class="products">
<article><img src="../assets/tioram-x.jpg" alt="티오람X 스마트 참고 이미지" loading="lazy"><div><h3>티오람X 스마트</h3><p>욕실 공간을 위한 제품</p></div></article>
<article><img src="../assets/airon-s.jpg" alt="에어온 S 참고 이미지" loading="lazy"><div><h3>에어온 S</h3><p>휴대형 공기질 측정기 · HPD-CP1</p></div></article>
<article><img src="../assets/ventilation.jpg" alt="일반 환기청정기 참고 이미지" loading="lazy"><div><h3>일반 환기청정기</h3><p>세대용 환기 제품</p></div></article>
</div>
</section>
<section class="contact" id="contact">
<div><h2>제품 및 설치 상담</h2><p>공간에 맞는 제품과 설치 가능 여부를 전화로 문의해 주세요.</p></div>
<a class="phone" href="tel:0413551195">041-355-1195</a>
</section>
</main>
<footer>주식회사 나인</footer>
<script>
const spaces = {
  bathroom: { title: '하루의 처음과 끝이 편안한 욕실', description: '욕실 공간에 맞는 제품과 설치 방법을 살펴보세요.', alt: '욕실 천장형 제품 설치 연출 이미지' },
  library: { title: '오래 머무는 도서관의 실내 공기', description: '독서와 학습이 이루어지는 공간의 환기와 공기질 관리를 살펴보세요.', alt: '로파S가 배치된 도서관 연출 이미지' },
  daycare: { title: '놀이와 배움이 함께하는 어린이집', description: '아이들이 생활하는 공간에 맞춰 환기와 공기질 관리를 상담할 수 있습니다.', alt: '로파S가 배치된 어린이집 연출 이미지' },
  office: { title: '매일 일하는 사무실의 실내 공기', description: '업무 공간의 사용 인원과 환기 여건을 바탕으로 설치 가능 여부를 확인해 보세요.', alt: '로파S가 배치된 사무실 연출 이미지' }
};
const nameLabel = document.querySelector('#space-name');
const title = document.querySelector('#space-title');
const description = document.querySelector('#space-description');
const photo = document.querySelector('#space-photo');
const buttons = document.querySelectorAll('[data-space]');
buttons.forEach(button => {
  button.addEventListener('click', () => {
    const space = spaces[button.dataset.space];
    nameLabel.textContent = button.textContent;
    title.textContent = space.title;
    description.textContent = space.description;
    photo.src = '../assets/' + button.dataset.space + '.jpg';
    photo.alt = space.alt;
    buttons.forEach(option => option.setAttribute('aria-pressed', String(option === button)));
  });
});
</script>
</body>
</html>
