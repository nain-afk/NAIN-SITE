<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="쿨윈의 냉방 급기와 벡터의 배기를 한 시스템으로 연결하는 나인의 기업용 스마트 환기 솔루션.">
<title>나인 | 쿨윈·벡터 스마트 환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&amp;display=swap">
<style>
:root{color-scheme:dark;--navy:#0e1b2d;--light:#f6f9ff;--muted:#c4d0e2;--line:#73839b}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--light);font:16px/1.6 "Noto Sans KR",sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #a6c8ff;outline-offset:4px}.shell{width:min(1240px,calc(100% - 80px));margin-inline:auto}
header{position:relative;z-index:1;background:var(--navy);border-bottom:1px solid #ffffff20}.bar{min-height:79px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{padding:8px 12px;border-radius:5px;background:#fff;display:inline-flex}.brand img{display:block;width:144px;height:auto}.bar nav{display:flex;gap:clamp(14px,3vw,36px);align-items:center;font-size:14px}.bar a:hover,.original:hover{text-decoration:underline;text-underline-offset:4px}
.hero{position:relative;isolation:isolate;display:flex;min-height:clamp(520px,calc(100svh - 79px),845px);align-items:center;overflow:hidden;background:#101d2e}.picture,.shade{position:absolute;inset:0;pointer-events:none}.picture{overflow:hidden;container-type:size;background:#101d2e url("../cooling-vector/roof.jpg") center 46%/cover no-repeat;z-index:-2}.picture iframe{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);border:0;width:max(100%,177.778cqh);height:max(100%,56.25cqw);opacity:0;transition:opacity .8s ease}.picture iframe.is-playing{opacity:1}.shade{z-index:-1;background:linear-gradient(90deg,rgba(8,19,35,.93) 0%,rgba(9,21,38,.65) 46%,rgba(10,22,38,.18) 100%),linear-gradient(0deg,rgba(8,17,31,.8),transparent 42%)}
.copy{padding-block:100px 118px}.eyebrow{margin:0 0 16px;color:#b9d2f8;font-size:14px;font-weight:700}.copy h1{margin:0;font-weight:800;font-size:clamp(38px,6.4vw,94px);line-height:1.1;letter-spacing:-.085em}.copy .lead{margin:22px 0 0;color:#eff4fc;max-width:37rem;font-size:clamp(16px,1.7vw,22px)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.action{min-height:46px;display:inline-flex;align-items:center;justify-content:center;padding:9px 19px;border:1px solid #c3d3ec;border-radius:5px;font-size:15px;font-weight:700}.action.primary{background:#e5efff;color:#172a45;border-color:#e5efff}.action:hover{box-shadow:0 0 0 1px currentColor}
.media-actions{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;justify-content:flex-end;align-items:center;gap:13px;flex-wrap:wrap;color:#e8f0ff;font-size:13px}.media-actions button{color:inherit;background:#0e1b2de8;border:1px solid #a7b8d0;padding:6px 11px;border-radius:4px}.media-actions button:disabled{cursor:default;opacity:.6}.original{text-underline-offset:4px}
@media(max-width:680px){.shell{width:calc(100% - 36px)}.bar{min-height:64px}.brand img{width:112px}.bar nav{font-size:13px;gap:13px}.hero{min-height:max(610px,calc(100svh - 64px));align-items:end}.shade{background:linear-gradient(0deg,rgba(8,17,31,.97) 4%,rgba(8,19,34,.79) 41%,rgba(10,22,38,.2) 85%)}.copy{padding-block:150px 93px}.media-actions{justify-content:flex-start;bottom:15px}}
@media(prefers-reduced-motion:reduce){.picture iframe{transition:none}}
</style>
</head>
<body>
<header><div class="bar shell"><a class="brand" href="./" aria-label="주식회사 나인 홈"><img src="../assets/logo.png" alt="Nain 주식회사 나인" width="183" height="34"></a><nav aria-label="주 메뉴"><a href="../cooling-vector/">제품 소개</a><a href="tel:0413551195">도입 문의</a></nav></div></header>
<main>
<section class="hero" aria-labelledby="main-title">
<div class="picture" aria-hidden="true"><div id="film"></div></div><div class="shade"></div>
<div class="copy shell"><p class="eyebrow">쿨윈 · 벡터 스마트 환기</p><h1 id="main-title">작업장에<br>공기의 길을 열다</h1><p class="lead">쿨윈이 바깥 공기를 식혀 들이고, 벡터가 작업장의 열기를 밖으로 내보냅니다.</p><div class="actions"><a class="action primary" href="../cooling-vector/">제품 소개</a><a class="action" href="tel:0413551195">현장 도입 문의</a></div></div>
<div class="media-actions shell"><button type="button" id="playback" disabled>영상 재생</button><a class="original" href="https://www.youtube.com/watch?v=OHTJ2a3ogHE">YouTube 원본 보기</a></div>
</section>
</main>
<script>
const toggle=document.querySelector('#playback');
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const videoId='OHTJ2a3ogHE';
let player;
let playing=false;
function showPlayback(active){
  playing=active;
  player.getIframe().classList.toggle('is-playing',active);
  toggle.textContent=active?'영상 일시정지':'영상 재생';
}
window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('film',{
    host:'https://www.youtube-nocookie.com',
    videoId,
    playerVars:{autoplay:0,controls:0,loop:1,playlist:videoId,playsinline:1,rel:0,origin:location.origin},
    events:{
      onReady:({target})=>{
        const iframe=target.getIframe();
        iframe.tabIndex=-1;
        iframe.setAttribute('title','나인 쿨윈·벡터 배경 영상');
        iframe.setAttribute('allow','autoplay; encrypted-media');
        target.mute();
        if(target.getAvailablePlaybackRates().includes(0.75)) target.setPlaybackRate(0.75);
        toggle.disabled=false;
        if(!reduceMotion.matches)target.playVideo();
      },
      onStateChange:({data})=>{
        if(data===YT.PlayerState.PLAYING)showPlayback(true);
        if(data===YT.PlayerState.PAUSED||data===YT.PlayerState.ENDED)showPlayback(false);
      },
      onError:()=>{showPlayback(false);toggle.hidden=true;}
    }
  });
};
toggle.addEventListener('click',()=>{
  if(playing)player.pauseVideo();
  else player.playVideo();
});
const api=document.createElement('script');
api.src='https://www.youtube.com/iframe_api';
api.addEventListener('error',()=>{toggle.hidden=true;});
document.head.append(api);
</script>
</body></html>
