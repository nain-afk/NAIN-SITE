<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고객센터 | 주식회사 나인</title><style>
:root{color-scheme:dark;--navy:#0e1b2d;--light:#f6f9ff;--muted:#c4d0e2;--line:#73839b}*{box-sizing:border-box}body{margin:0;background:var(--navy);color:var(--light);font:16px/1.6 "Noto Sans KR",sans-serif;word-break:keep-all}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #a6c8ff;outline-offset:4px}.shell{width:min(1240px,calc(100% - 80px));margin-inline:auto}
header{position:relative;z-index:1;background:var(--navy);border-bottom:1px solid #ffffff20}.bar{min-height:79px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:inline-flex;align-items:center;padding:8px 0}.brand img{display:block;width:144px;height:auto;filter:brightness(0) invert(1)}.bar nav{display:flex;gap:clamp(14px,3vw,36px);align-items:center;font-size:14px}.bar a:hover,.original:hover{text-decoration:underline;text-underline-offset:4px}
.bar nav{display:flex;align-items:center;gap:clamp(12px,3.4vw,42px);flex-wrap:wrap}.bar nav a{white-space:nowrap;font-weight:600}.bar nav [aria-current=page]{color:#b8d5ff;text-decoration:underline;text-underline-offset:7px}@media(max-width:620px){.bar{flex-wrap:wrap;gap:6px;padding-block:10px}.bar nav{width:100%;justify-content:space-between;gap:8px;padding-bottom:4px}.bar nav a{font-size:13px}}.social-links{display:inline-flex;align-items:center;gap:5px}.social-links a{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;color:#e7eeff;transition:background .16s ease}.social-links a:hover{background:#ffffff19}.social-links a:focus-visible{outline:2px solid #b8d5ff;outline-offset:2px}.social-links a>span{position:relative;display:block}.social-youtube{width:19px;height:13px;background:currentColor;border-radius:4px}.social-youtube::after{content:"";position:absolute;left:8px;top:3px;border-left:5px solid #0e1b2d;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}.social-instagram{width:17px;height:17px;border:1.5px solid currentColor;border-radius:5px}.social-instagram::before{content:"";position:absolute;inset:3.5px;border:1.4px solid currentColor;border-radius:50%}.social-instagram::after{content:"";position:absolute;right:2px;top:2px;width:2px;height:2px;border-radius:50%;background:currentColor}.social-site{width:17px;height:17px;border:1.4px solid currentColor;border-radius:50%}.social-site::before{content:"";position:absolute;inset:-1px 3px;border:1.2px solid currentColor;border-radius:50%}.social-site::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid currentColor}@media(max-width:620px){.bar{position:relative}.bar .social-links{position:absolute;right:0;top:7px}}
